[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vact"
version = "0.1.0"
description = "Vector Agent Context Transport (VACT) - Python SDK for 60 FPS Sub-Pixel AI Desktop OS Automation"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "fy2ne", email = "hello@fy2ne.me" }
]
keywords = ["vact", "gemini", "vertex-ai", "cinema", "gui-agent", "os-world", "computer-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/fy2ne/VACT"
Documentation = "https://fy2ne.me"
Repository = "https://github.com/fy2ne/VACT"
